<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-labelledby="t d">
<title id="t">How BYOA works</title>
<desc id="d">1. In a web app you click Connect Agent and approve the site in the BYOA extension. 2. The app asks for work with a prompt and the names of its WebMCP tools. 3. BYOA runs your agent on your model provider with your API key. 4. The agent calls the app's tools in the page. 5. The app shows the proposed change and you accept or reject it.</desc>
